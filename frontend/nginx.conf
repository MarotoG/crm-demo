# Un solo origen (T28): la interfaz y /api salen de la misma dirección, sin CORS.
# A este nginx solo llega el conector de Cloudflare: no publica ningún puerto en el servidor.

# Registro de accesos: IP real y ruta sin parámetros, que pueden llevar búsquedas con datos de contactos.
log_format crm '$http_cf_connecting_ip [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log crm;
    server_tokens off;
    client_max_body_size 256k;

    # Se aplican a todas las respuestas porque ninguna location usa add_header (si lo hiciera, las perdería).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Un día y solo esta dirección: fácil de revertir si hubiera que dejar de usar HTTPS.
    add_header Strict-Transport-Security "max-age=86400" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Con variable, el nombre se resuelve en cada petición: nginx arranca aunque la API aún no
        # esté y sigue encontrándola si se recrea con otra IP. 127.0.0.11 es el DNS de Docker.
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        # La IP la pone Cloudflare y reemplaza lo que envíe el visitante. Se descarta cualquier
        # X-Forwarded-For recibido, y la API solo atiende esta cabecera si viene de este nginx.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    }

    # Los archivos de Vite llevan su huella en el nombre: si cambian, cambia el nombre.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Las rutas de la interfaz (/recepcion, /pendientes, /auditoria...) las resuelve React en el
    # navegador: recargar en cualquiera de ellas debe devolver index.html, nunca guardado en caché.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
